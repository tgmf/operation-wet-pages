<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Operation: Wet Pages</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
<style>
  :root {
    --bg: #f4f1ea;
    --bg-alt: #ffffff;
    --text: #24211c;
    --text-dim: #6b6558;
    --accent: #2f6f6b;
    --accent-text: #ffffff;
    --border: #ddd6c7;
    --gm: #8c3b3b;
    --gm-bg: #f8e9e9;
    --code-bg: #eee8da;
  }
  [data-theme="dark"] {
    --bg: #1b1a17;
    --bg-alt: #232019;
    --text: #ece7db;
    --text-dim: #a39c8a;
    --accent: #5fb8b0;
    --accent-text: #10201f;
    --border: #3a362c;
    --gm: #e08a8a;
    --gm-bg: #33201f;
    --code-bg: #2a271f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg-alt);
    border-bottom: 1px solid var(--border);
  }
  .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 4px;
  }
  .titlebar h1 {
    font-size: 1.05rem;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #theme-toggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  nav {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 6px 10px 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  nav button {
    flex: 0 0 auto;
    appearance: none;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    min-height: 44px;
  }
  nav button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  nav button.gm:not(.active) {
    color: var(--gm);
    border-color: var(--gm);
  }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 20px 16px 80px;
    line-height: 1.55;
    font-size: 1.02rem;
  }
  #doc-banner {
    display: none;
    margin-bottom: 16px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--gm-bg);
    color: var(--gm);
    font-size: 0.9rem;
    font-weight: 600;
  }
  #doc-banner.show { display: block; }
  #content h1 { font-size: 1.5rem; margin-top: 0; }
  #content h2 {
    font-size: 1.2rem;
    margin-top: 2em;
    padding-top: 0.4em;
    border-top: 1px solid var(--border);
  }
  #content h3 { font-size: 1.05rem; margin-top: 1.6em; color: var(--text-dim); }
  #content p, #content ul, #content ol { margin: 0.8em 0; }
  #content a { color: var(--accent); }
  #content strong { color: var(--text); }
  #content em { color: var(--text-dim); }
  .table-wrap { overflow-x: auto; margin: 1em 0; border: 1px solid var(--border); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: var(--code-bg); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  code {
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  pre {
    background: var(--code-bg);
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
  }
  pre code { background: none; padding: 0; }
  blockquote {
    margin: 1em 0;
    padding: 0.2em 1em;
    border-left: 3px solid var(--accent);
    color: var(--text-dim);
  }
  hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  .mermaid { background: var(--bg-alt); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin: 1em 0; overflow-x: auto; }
  #loading { color: var(--text-dim); padding: 40px 0; text-align: center; }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    padding: 20px 0 40px;
  }
</style>
</head>
<body>
<header>
  <div class="titlebar">
    <h1 id="page-title">Operation: Wet Pages</h1>
    <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main>
  <div id="doc-banner">🐾 DM eyes only — spoilers ahead</div>
  <div id="content"><div id="loading">Loading…</div></div>
</main>
<footer>Operation: Wet Pages — reference site</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  const docs = [
    { id: "player-handout", label: "Player Handout", file: "content/player-handout.md" },
    { id: "npc-sheets", label: "NPC Sheets", file: "content/npc-sheets.md" },
    { id: "crew-tikk-sheets", label: "Crew & Tikk", file: "content/crew-tikk-sheets.md" },
    { id: "dm-document", label: "DM Document", file: "content/dm-document.md", gm: true },
    { id: "recon-head-office", label: "Head Office", file: "content/recon-head-office.md" },
  ];

  const tabsEl = document.getElementById("tabs");
  const contentEl = document.getElementById("content");
  const bannerEl = document.getElementById("doc-banner");
  const pageTitleEl = document.getElementById("page-title");
  const cache = {};

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("theme-toggle").textContent = theme === "dark" ? "☀️" : "🌙";
    try { localStorage.setItem("wetpages-theme", theme); } catch (e) {}
  }

  let theme = "light";
  try {
    theme = localStorage.getItem("wetpages-theme") ||
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  } catch (e) {}
  applyTheme(theme);

  document.getElementById("theme-toggle").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    applyTheme(theme);
  });

  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
  }

  docs.forEach((doc) => {
    const btn = document.createElement("button");
    btn.textContent = doc.label;
    btn.dataset.id = doc.id;
    if (doc.gm) btn.classList.add("gm");
    btn.addEventListener("click", () => loadDoc(doc.id, true));
    tabsEl.appendChild(btn);
  });

  function setActiveTab(id) {
    [...tabsEl.children].forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.id === id);
    });
  }

  async function loadDoc(id, pushHash) {
    const doc = docs.find((d) => d.id === id) || docs[0];
    setActiveTab(doc.id);
    bannerEl.classList.toggle("show", !!doc.gm);
    pageTitleEl.textContent = doc.label;
    if (pushHash) history.replaceState(null, "", "#" + doc.id);
    try { localStorage.setItem("wetpages-lasttab", doc.id); } catch (e) {}

    if (cache[doc.id]) {
      contentEl.innerHTML = cache[doc.id];
      renderMermaid();
      window.scrollTo(0, 0);
      return;
    }

    contentEl.innerHTML = '<div id="loading">Loading…</div>';
    try {
      const res = await fetch(doc.file);
      const md = await res.text();
      const html = marked.parse(md, { gfm: true, breaks: false });
      contentEl.innerHTML = html;
      wrapTables();
      convertMermaidBlocks();
      cache[doc.id] = contentEl.innerHTML;
      renderMermaid();
    } catch (err) {
      contentEl.innerHTML = "<p>Could not load this page.</p>";
    }
    window.scrollTo(0, 0);
  }

  function wrapTables() {
    contentEl.querySelectorAll("table").forEach((table) => {
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });
  }

  function convertMermaidBlocks() {
    contentEl.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
  }

  function renderMermaid() {
    if (!window.mermaid) return;
    const nodes = contentEl.querySelectorAll(".mermaid:not([data-processed])");
    if (nodes.length) {
      mermaid.run({ nodes: [...nodes] }).catch(() => {});
    }
  }

  const startId = (location.hash || "").replace("#", "") ||
    (function () { try { return localStorage.getItem("wetpages-lasttab"); } catch (e) { return null; } })() ||
    docs[0].id;
  loadDoc(startId, false);

  window.addEventListener("hashchange", () => {
    const id = (location.hash || "").replace("#", "");
    if (id) loadDoc(id, false);
  });
</script>
</body>
</html>
